<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#0b1020;color:#eef4ff;font-family:Inter,Segoe UI,Arial,sans-serif}
.hero{box-sizing:border-box;width:100%;padding:26px 28px 22px;border:1px solid rgba(117,159,222,.2);border-radius:18px;background:radial-gradient(circle at 88% 8%,rgba(126,83,255,.23),transparent 32%),linear-gradient(135deg,#17243a,#101829);position:relative;overflow:hidden}
.hero:after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(64,145,255,.07);right:-40px;bottom:-80px}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#84baff;font-weight:700;margin-bottom:10px}
h1{font-size:27px;line-height:1.1;margin:0;color:#f4f7ff;font-weight:800;letter-spacing:-.04em}
p{font-size:13px;margin:9px 0 0;color:#9eabc4}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#42d9a0;box-shadow:0 0 12px #42d9a0;vertical-align:middle;margin-right:7px}
@media(max-width:600px){.hero{padding:20px 18px}h1{font-size:22px}}
</style></head><body>
<div class="hero"><div class="kicker">MODEL & FRAUD ANALYTICS <span class="pulse"></span></div>
<h1>{{ title }}</h1><p>{{ subtitle }}</p></div>
<script>{{ js_script }}</script>
</body></html>
